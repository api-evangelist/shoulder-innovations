aid: shoulder-innovations
name: Shoulder Innovations
description: 'Shoulder Innovations is a commercial-stage medical technology company headquartered in
  Grand Rapids, Michigan, focused exclusively on the shoulder surgical care market. Founded in 2009 by
  Dr. Steve Gunther, it develops the InSet(R) shoulder arthroplasty portfolio - the InSet Glenoid, InSet
  Total Shoulder and InSet Reverse Shoulder systems, the I-Series humeral stems and a streamlined one-
  and two-tray instrument system - built around inset glenoid fixation designed to reduce the "rocking
  horse" forces implicated in glenoid implant failure. It also publishes ProVoyance(R) Shoulder, a
  first-party AI/ML pre-operative planning application that turns CT imaging into 3D bone
  reconstructions and is delivered to surgeons through a customer login portal. The company listed
  publicly in July 2025 under the ticker SI. It ships no public API, SDK, webhook surface or developer
  program; ProVoyance is an end-user clinical application, not a platform.'
